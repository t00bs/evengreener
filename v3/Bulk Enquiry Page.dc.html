<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="_ds/evengreener-design-system-ede5a68e-3ce4-4c3a-82c1-af597595dcea/styles.css">
<script src="_ds/evengreener-design-system-ede5a68e-3ce4-4c3a-82c1-af597595dcea/_ds_bundle.js"></script>
<script src="eg-shared.js"></script>
<style>body{margin:0;background:#fff}a{color:var(--eg-color-link)}a:hover{color:var(--eg-color-link-hover)}</style>
</helmet>
<div style="position:relative;background:var(--eg-white);color:var(--eg-color-text)">
  <x-import component-from-global-scope="EvenGreenerDesignSystem_ede5a6.AnnouncementBar" hint-size="100%,32px"></x-import>
  <x-import component-from-global-scope="EvenGreenerDesignSystem_ede5a6.Header" nav="{{ nav }}" utility-links="{{ utility }}" search-scopes="{{ scopes }}" bag-count="{{ bagCount }}" bag-total="{{ bagTotal }}" on-bag="{{ openDrawer }}" hint-size="100%,60px"></x-import>
  <main>
    <div style="max-width:var(--eg-container-max);margin-inline:auto;padding-inline:{{ gut }};padding-top:{{ L.top }}">
      <x-import component-from-global-scope="EvenGreenerDesignSystem_ede5a6.Breadcrumb" items="{{ crumbs }}" hint-size="160px,20px"></x-import>
    </div>
    <x-import component-from-global-scope="EvenGreenerDesignSystem_ede5a6.BulkEnquiry" eyebrow="Bulk buy" title="Buying for a school, council or business?" text="Tell us what you need and our team will come back with a quote within 1 working day." points="{{ points }}" hint-size="100%,640px"></x-import>

    <section aria-labelledby="how-title" style="background:var(--eg-color-bg-alt);padding-block:{{ secPad }}">
      <div style="max-width:var(--eg-container-max);margin-inline:auto;padding-inline:{{ gut }};display:grid;gap:{{ L.headGap }}">
        <h2 id="how-title" class="eg-h2" style="margin:0">How it works</h2>
        <ol style="list-style:none;margin:0;padding:0;display:grid;grid-template-columns:{{ L.cols }};gap:{{ L.cardGap }}">
          <sc-for list="{{ steps }}" as="s" hint-placeholder-count="3">
            <li style="display:grid;gap:8px;align-content:start;padding-top:20px;border-top:1px solid var(--eg-color-border-on-alt)">
              <span style="font:800 40px/1 var(--eg-font-display);color:var(--eg-forest-700)">{{ s.n }}</span>
              <h3 class="eg-h4" style="margin:0">{{ s.title }}</h3>
              <p style="margin:0;font-size:var(--eg-text-body-sm);line-height:1.6;color:var(--eg-color-text-muted)">{{ s.text }}</p>
            </li>
          </sc-for>
        </ol>
      </div>
    </section>

    <section style="padding-block:{{ secPad }}">
      <div style="max-width:var(--eg-container-max);margin-inline:auto;padding-inline:{{ gut }};display:grid;grid-template-columns:{{ L.faqCols }};gap:{{ L.faqGap }};align-items:start">
        <h2 class="eg-h2" style="margin:0">Bulk buying questions</h2>
        <x-import component-from-global-scope="EvenGreenerDesignSystem_ede5a6.Accordion" items="{{ faqs }}" hint-size="100%,240px"></x-import>
      </div>
    </section>
  </main>
  <x-import component-from-global-scope="EvenGreenerDesignSystem_ede5a6.Footer" columns="{{ footerCols }}" hint-size="100%,520px"></x-import>
  <sc-if value="{{ drawerOpen }}" hint-placeholder-val="{{ false }}">
    <dc-import name="Cart Drawer" open="{{ true }}" items="{{ drawerItems }}" on-close="{{ closeDrawer }}" hint-size="0px,0px"></dc-import>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { w: window.innerWidth, ready: !!window.EGData };
  componentDidMount() {
    this.onR = () => this.setState({ w: window.innerWidth });
    window.addEventListener('resize', this.onR);
    this.t = setInterval(() => { if (!this.state.ready && window.EGData) this.setState({ ready: true }); }, 300);
  }
  componentWillUnmount() { clearInterval(this.t); window.removeEventListener('resize', this.onR); }
  renderVals() {
    const S = window.EGUtil ? window.EGUtil.shell(this) : {};
    const m = this.state.w < 900;
    return Object.assign(S, {
      L: { top: m ? '20px' : '40px', headGap: m ? '20px' : '32px', cols: m ? 'minmax(0,1fr)' : 'repeat(3,minmax(0,1fr))', cardGap: m ? '24px' : 'var(--eg-grid-gap)', faqCols: m ? 'minmax(0,1fr)' : 'minmax(0,4fr) minmax(0,7fr)', faqGap: m ? '20px' : '64px' },
      crumbs: [{ label: 'Home', href: 'Home Page.dc.html' }, { label: 'Bulk enquiries' }],
      points: ['Volume pricing from 10 units', 'Delivery to multiple sites', 'Help choosing the right products'],
      steps: [
        { n: '1', title: 'Tell us what you need', text: 'Products, rough quantities and where they are going. A best guess is fine.' },
        { n: '2', title: 'Get your quote', text: 'Our team replies within 1 working day with prices and delivery options.' },
        { n: '3', title: 'We deliver', text: 'To one address or several sites, with a single point of contact throughout.' },
      ],
      faqs: [
        { title: 'What counts as a bulk order?', content: 'Usually 10 or more of the same product, or a mixed order for a school, council, housing association or business.' },
        { title: 'Can you invoice us?', content: 'Yes. Ask for invoice payment with your quote and we will set it up for your organisation.' },
        { title: 'Do you supply councils with branded caddies?', content: 'Get in touch with the details and our team will let you know what is possible for your order size.' },
      ],
    });
  }
}
</script>
</body>
</html>
