<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="_ds/evengreener-design-system-ede5a68e-3ce4-4c3a-82c1-af597595dcea/styles.css">
<script src="_ds/evengreener-design-system-ede5a68e-3ce4-4c3a-82c1-af597595dcea/_ds_bundle.js"></script>
<script src="eg-shared.js"></script>
<style>body{margin:0;background:#fff}a{color:var(--eg-color-link)}a:hover{color:var(--eg-color-link-hover)}</style>
</helmet>
<div style="position:relative;background:var(--eg-white);color:var(--eg-color-text)">
  <x-import component-from-global-scope="EvenGreenerDesignSystem_ede5a6.AnnouncementBar" hint-size="100%,32px"></x-import>
  <x-import component-from-global-scope="EvenGreenerDesignSystem_ede5a6.Header" nav="{{ nav }}" utility-links="{{ utility }}" search-scopes="{{ scopes }}" bag-count="{{ bagCount }}" bag-total="{{ bagTotal }}" on-bag="{{ openDrawer }}" hint-size="100%,60px"></x-import>
  <!-- Mobile category bar (28 Oct review). Option B default: one swipeable row of full category names. Option C: compact, sticky, hides on scroll down. ?nav=a|b|c -->
  <sc-if value="{{ catBarB }}" hint-placeholder-val="{{ false }}">
    <nav class="egx-catbar" data-note="N1" aria-label="Shop by category">
      <ul role="list">
        <sc-for list="{{ catBar }}" as="q" hint-placeholder-count="7">
          <li><a href="{{ q.href }}" class="eg-chip">{{ q.label }}</a></li>
        </sc-for>
      </ul>
    </nav>
  </sc-if>
  <sc-if value="{{ catBarC }}" hint-placeholder-val="{{ false }}">
    <nav class="egx-catbar egx-catbar--c" data-note="N1" aria-label="Shop by category">
      <ul role="list">
        <sc-for list="{{ catBar }}" as="q" hint-placeholder-count="7">
          <li><a href="{{ q.href }}" class="eg-chip">{{ q.label }}</a></li>
        </sc-for>
      </ul>
    </nav>
  </sc-if>

  <main style="max-width:var(--eg-container-max);margin-inline:auto;padding-inline:{{ gut }};padding-block:{{ L.pad }}">
    <div style="display:grid;gap:{{ L.headGap }};margin-bottom:{{ L.headGap }}">
      <x-import component-from-global-scope="EvenGreenerDesignSystem_ede5a6.Breadcrumb" items="{{ crumbs }}" hint-size="200px,20px"></x-import>
      <div style="display:grid;gap:8px;max-width:760px">
        <h1 class="eg-h1" style="margin:0">Shop all collections</h1>
        <p class="eg-muted" style="margin:0;font-size:{{ L.standfirst }}">Everything we sell, grouped the way you shop.</p>
      </div>
    </div>
    <div style="display:grid;gap:{{ L.groupGap }}">
      <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
        <section style="display:grid;gap:{{ L.cardGap }};padding-top:{{ L.groupPad }};border-top:1px solid var(--eg-color-border)">
          <div style="display:flex;justify-content:space-between;align-items:baseline;gap:16px">
            <h2 class="eg-h3" style="margin:0">{{ g.title }}</h2>
            <x-import component-from-global-scope="EvenGreenerDesignSystem_ede5a6.LinkCta" href="{{ g.href }}" hint-size="70px,24px">{{ g.cta }}</x-import>
          </div>
          <div style="display:grid;grid-template-columns:{{ L.cols }};gap:{{ L.cardGap }}">
            <sc-for list="{{ g.items }}" as="c" hint-placeholder-count="4">
              <x-import component-from-global-scope="EvenGreenerDesignSystem_ede5a6.CategoryCard" image="{{ c.image }}" variant="overlay" title="{{ c.title }}" text="{{ c.text }}" cta="Shop now" label="{{ c.title }}" href="{{ c.href }}" hint-size="100%,360px"></x-import>
            </sc-for>
          </div>
        </section>
      </sc-for>
    </div>
  </main>

  <x-import component-from-global-scope="EvenGreenerDesignSystem_ede5a6.Footer" columns="{{ footerCols }}" hint-size="100%,520px"></x-import>
  <sc-if value="{{ drawerOpen }}" hint-placeholder-val="{{ false }}">
    <dc-import name="Cart Drawer" open="{{ true }}" items="{{ drawerItems }}" on-close="{{ closeDrawer }}" hint-size="0px,0px"></dc-import>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { w: window.innerWidth, ready: !!window.EGData };
  componentDidMount() {
    this.onR = () => this.setState({ w: window.innerWidth });
    window.addEventListener('resize', this.onR);
    this.t = setInterval(() => { if (!this.state.ready && window.EGData) this.setState({ ready: true }); }, 300);
  }
  componentWillUnmount() { clearInterval(this.t); window.removeEventListener('resize', this.onR); }
  renderVals() {
    const S = window.EGUtil ? window.EGUtil.shell(this) : {};
    const m = this.state.w < 900;
    const I = window.EGImg || { src() {}, item() {}, post() {}, cat() {}, johanna: null };
    const c = (title, text) => ({ title, text, image: I.cat(title), href: /water|tank|barrel|diverter/i.test(title) ? 'Collection Page.dc.html?c=water' : /compost|tumbler|accessories/i.test(title) ? 'Collection Page.dc.html?sub=' + encodeURIComponent(title) : 'Collection Page.dc.html' });
    return Object.assign(S, {
      L: { pad: m ? '20px 48px' : '40px 96px', headGap: m ? '16px' : '32px', standfirst: m ? 'var(--eg-text-body)' : 'var(--eg-text-body-lg)', groupGap: m ? '40px' : '64px', groupPad: m ? '24px' : '32px', cardGap: m ? '12px' : 'var(--eg-grid-gap)', cols: m ? 'repeat(2,minmax(0,1fr))' : 'repeat(4,minmax(0,1fr))' },
      crumbs: [{ label: 'Home', href: 'Home Page.dc.html' }, { label: 'Collections' }],
      groups: [
        { title: 'Water butts and tanks', href: 'Collection Page.dc.html?c=water', cta: 'Shop all', items: [c('Slimline water butts', 'For side returns and small spaces'), c('Wall tanks', 'Flat to the wall, big capacity'), c('Classic barrels', 'Traditional look'), c('Diverters and accessories', 'Kits, stands, taps and links')] },
        { title: 'Composting', href: 'Collection Page.dc.html', cta: 'Shop all', items: [c('Standard composters', 'Garden waste and peelings'), c('Hot composters', 'Compost in 1 to 3 months'), c('Food waste composting', 'Cooked food, meat and dairy'), c('Wooden composters', 'Timber bays and beehives'), c('Tumblers', 'Turn for faster compost'), c('Bokashi composters', 'Ferment food waste indoors'), c('Worm composters', 'Wormeries and worms'), c('Electric composters', 'Compost in 24 hours'), c('Accessories', 'Thermometers, aerators, activators')] },
        { title: 'Indoor and kitchen', href: 'Collection Page.dc.html', cta: 'Shop all', items: [c('Kitchen caddies', 'Countertop food waste bins'), c('Indoor recycling', 'Sort it where you use it'), c('Indoor watering', 'Self-watering pots and cans'), c('Food waste management', 'Digesters and food waste bins')] },
        { title: 'In the garden and gifts', href: 'Collection Page.dc.html', cta: 'Shop all', items: [c('Planters', 'Raised beds and window boxes'), c('Wildlife corner', 'Bug hotels and feeders'), c('Gifts under £30', 'Thoughtful and useful'), c('Gifts for children', 'Grow kits and wormeries')] },
      ],
    });
  }
}
</script>
</body>
</html>
