<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/evengreener-design-system-ede5a68e-3ce4-4c3a-82c1-af597595dcea/styles.css">
<script src="_ds/evengreener-design-system-ede5a68e-3ce4-4c3a-82c1-af597595dcea/_ds_bundle.js"></script>
<script src="eg-shared.js"></script>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#F1EFE7}a{color:#296647}a:hover{color:#143324}</style>
</helmet>
<div style="height:100vh;display:grid;grid-template-rows:auto auto minmax(0,1fr);background:var(--eg-oat-100);color:var(--eg-color-text);font-family:var(--eg-font-body)">
  <header style="display:flex;align-items:center;gap:24px;padding:14px 24px 10px;background:#fff">
    <div style="display:grid;gap:6px;min-width:0;flex:1">
      <p class="eg-eyebrow" style="margin:0">CRO redesign · Desktop 1440px</p>
      <div style="display:flex;align-items:baseline;gap:12px;min-width:0">
        <span style="flex:none;font:600 14px/1 var(--eg-font-body);color:var(--eg-forest-700);font-variant-numeric:tabular-nums">{{ counter }}</span>
        <h1 class="eg-h4" style="margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ current.title }}</h1>
        <span style="flex:none;font-size:13px;color:var(--eg-stone-600)">{{ scaleLabel }}</span>
      </div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex:none">
      <sc-if value="{{ current.hasNotes }}" hint-placeholder-val="{{ false }}">
        <button type="button" class="eg-btn eg-btn--secondary eg-btn--sm" aria-pressed="{{ notesPressed }}" onClick="{{ toggleNotes }}">{{ notesLabel }}</button>
      </sc-if>
      <a href="{{ current.src }}" target="_blank" class="eg-btn eg-btn--secondary eg-btn--sm">Open page</a>
      <button type="button" class="eg-btn eg-btn--secondary eg-btn--sm" onClick="{{ prev }}">Previous</button>
      <button type="button" class="eg-btn eg-btn--primary eg-btn--sm" onClick="{{ next }}">Next</button>
    </div>
  </header>

  <div style="padding:0 24px 12px;background:#fff;border-bottom:1px solid var(--eg-stone-300)">
    <div ref="{{ trackRef }}" onPointerDown="{{ onDown }}" onPointerMove="{{ onMove }}" onPointerUp="{{ onUp }}" onPointerCancel="{{ onUp }}" style="display:flex;gap:16px;cursor:pointer;touch-action:none;user-select:none">
      <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
        <div style="flex:{{ g.count }};display:grid;gap:2px;min-width:0">
          <div style="display:flex;gap:3px">
            <sc-for list="{{ g.pages }}" as="p" hint-placeholder-count="4">
              <div data-i="{{ p.i }}" title="{{ p.title }}" style="flex:1;height:24px;padding:8px 0;background-clip:content-box;background-color:{{ p.bg }}" style-hover="background-color:var(--eg-forest-900)"></div>
            </sc-for>
          </div>
          <span style="font:500 11px/1.2 var(--eg-font-body);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:{{ g.color }}">{{ g.name }}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <main ref="{{ stageRef }}" style="position:relative;min-height:0;overflow-x:{{ overflowX }};overflow-y:hidden;padding:24px">
    <div style="position:relative;margin:0 auto;width:{{ frameW }};height:{{ frameH }};background:#fff;outline:1px solid var(--eg-oat-300);overflow:hidden">
      <iframe data-bind-src="{{ src }}" title="{{ current.title }}" style="position:absolute;top:0;left:0;width:1440px;height:{{ iframeH }};border:0;transform:scale({{ scale }});transform-origin:0 0"></iframe>
      <sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;top:16px;right:16px;padding:6px 12px;background:var(--eg-forest-900);color:#fff;font:500 13px/1.4 var(--eg-font-body)">Loading {{ current.title }}</div>
      </sc-if>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;fit&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Viewer&quot;},&quot;notes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Viewer&quot;}}">
const EG_PAGES = [
  ['Core CRO pages', [
    ['Homepage', 'Home Page.dc.html', 'notes=all'],
    ['Product page', 'Product Page.dc.html', 'notes=all'],
    ['Cart page', 'Cart Page.dc.html', 'notes=all'],
    ['Cart drawer', 'Home Page.dc.html?drawer=1', 'notes=D1,D2,D3,D4'],
  ]],
  ['Shopping', [
    ['Collection: composting', 'Collection Page.dc.html'],
    ['Collection: water butts', 'Collection Page.dc.html?c=water'],
    ['All collections', 'Collections List Page.dc.html'],
    ['Search results', 'Search Page.dc.html?q=water%20butt'],
    ['Search, no results', 'Search Page.dc.html?q=compost%20tea'],
  ]],
  ['Content and help', [
    ['Knowledge hub', 'Blog Page.dc.html'],
    ['Guide article', 'Article Page.dc.html'],
    ['About us', 'About Page.dc.html'],
    ['Contact us', 'Contact Page.dc.html'],
    ['Help and FAQs', 'FAQ Page.dc.html'],
    ['Bulk enquiries', 'Bulk Enquiry Page.dc.html'],
  ]],
  ['Account and utility', [
    ['Sign in', 'Account Page.dc.html?view=login'],
    ['Create account', 'Account Page.dc.html?view=register'],
    ['Reset password', 'Account Page.dc.html?view=reset'],
    ['Account: orders', 'Account Page.dc.html?view=orders'],
    ['Order detail', 'Account Page.dc.html?view=order'],
    ['Addresses', 'Account Page.dc.html?view=addresses'],
    ['Page not found', '404 Page.dc.html'],
    ['Password page', 'Password Page.dc.html'],
    ['Gift card', 'Gift Card Page.dc.html'],
  ]],
];
const EG_FLAT = [];
EG_PAGES.forEach(([group, list]) => list.forEach(([title, src, notes]) => EG_FLAT.push({ i: EG_FLAT.length, group, title, src, notes: notes || '', hasNotes: !!notes })));
const EG_KEY = 'eg-desktop-viewer-idx';

class Component extends DCLogic {
  state = { idx: 0, srcIdx: 0, notes: null, w: 1200, h: 700, loading: true };
  trackRef = React.createRef();
  stageRef = React.createRef();

  componentDidMount() {
    // iframe load listener (an inline onLoad attribute fires on the raw template before it renders)
    this.onFrameLoad = (e) => { if (e.target && e.target.tagName === 'IFRAME' && e.target.getAttribute('src')) this.setState({ loading: false }); };
    document.addEventListener('load', this.onFrameLoad, true);
    const saved = Number(localStorage.getItem(EG_KEY));
    if (saved >= 0 && saved < EG_FLAT.length) this.setState({ idx: saved, srcIdx: saved });
    this.ro = new ResizeObserver(() => this.measure());
    if (this.stageRef.current) this.ro.observe(this.stageRef.current);
    this.measure();
    this.onKey = (e) => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
      if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); this.go(this.state.idx + 1); }
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); this.go(this.state.idx - 1); }
      if (e.key === 'Home') this.go(0);
      if (e.key === 'End') this.go(EG_FLAT.length - 1);
    };
    window.addEventListener('keydown', this.onKey);
  }
  componentWillUnmount() { this.ro && this.ro.disconnect(); window.removeEventListener('keydown', this.onKey); clearTimeout(this.t); }

  measure() {
    const el = this.stageRef.current; if (!el) return;
    const w = el.clientWidth - 48, h = el.clientHeight - 48;
    if (Math.abs(w - this.state.w) > 1 || Math.abs(h - this.state.h) > 1) this.setState({ w, h });
  }

  go(i, immediate) {
    const idx = Math.max(0, Math.min(EG_FLAT.length - 1, i));
    if (idx === this.state.idx && !immediate) return;
    this.setState({ idx });
    try { localStorage.setItem(EG_KEY, String(idx)); } catch (e) {}
    clearTimeout(this.t);
    const load = () => { if (this.state.srcIdx !== this.state.idx) this.setState({ srcIdx: this.state.idx, loading: true }); };
    if (immediate) load(); else this.t = setTimeout(load, 200);
  }

  pick(e) {
    const track = this.trackRef.current; if (!track) return;
    const bar = track.querySelector('[data-i]'); if (!bar) return;
    const r = bar.getBoundingClientRect();
    const el = document.elementFromPoint(e.clientX, r.top + r.height / 2);
    const seg = el && el.closest && el.closest('[data-i]');
    if (seg && track.contains(seg)) this.go(Number(seg.getAttribute('data-i')));
  }

  renderVals() {
    const { idx, srcIdx, w, h, loading } = this.state;
    const fit = this.props.fit ?? true;
    const notesOn = this.state.notes ?? (this.props.notes ?? false);
    const current = EG_FLAT[idx];
    const loaded = EG_FLAT[srcIdx];
    const s = fit ? Math.min(1, Math.max(0.2, w / 1440)) : 1;
    const frameW = fit ? Math.round(1440 * s) : 1440;
    const frameH = Math.max(200, h);
    let src = loaded.src;
    if (notesOn && loaded.notes) src += (src.includes('?') ? '&' : '?') + loaded.notes;
    const groups = EG_PAGES.map(([name, list]) => {
      const pages = EG_FLAT.filter((p) => p.group === name).map((p) => ({
        i: String(p.i), title: p.title,
        bg: p.i === idx ? 'var(--eg-forest-700)' : p.i < idx ? 'var(--eg-leaf-200)' : 'var(--eg-stone-300)',
      }));
      return { name, count: String(list.length), pages, color: current.group === name ? 'var(--eg-forest-900)' : 'var(--eg-stone-600)' };
    });
    return {
      current, groups, src, loading,
      counter: String(idx + 1).padStart(2, '0') + ' / ' + EG_FLAT.length,
      scaleLabel: current.group + ' · ' + Math.round(s * 100) + '%',
      scale: String(s),
      frameW: frameW + 'px', frameH: frameH + 'px', iframeH: Math.round(frameH / s) + 'px',
      overflowX: fit ? 'hidden' : 'auto',
      notesPressed: notesOn ? 'true' : 'false',
      notesLabel: notesOn ? 'Hide CRO notes' : 'Show CRO notes',
      toggleNotes: () => this.setState({ notes: !notesOn, loading: true }),
      prev: () => this.go(idx - 1, true),
      next: () => this.go(idx + 1, true),
      onLoad: () => this.setState({ loading: false }),
      trackRef: this.trackRef, stageRef: this.stageRef,
      onDown: (e) => { this.dragging = true; try { e.currentTarget.setPointerCapture(e.pointerId); } catch (x) {} this.pick(e); },
      onMove: (e) => { if (this.dragging) this.pick(e); },
      onUp: () => { this.dragging = false; this.go(this.state.idx, true); },
    };
  }
}
</script>
</body>
</html>
