<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js?v=12nov1"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="_ds/evengreener-design-system-ede5a68e-3ce4-4c3a-82c1-af597595dcea/styles.css?v=12nov1">
<script src="_ds/evengreener-design-system-ede5a68e-3ce4-4c3a-82c1-af597595dcea/_ds_bundle.js?v=12nov1"></script>
<script src="eg-shared.js?v=12nov1"></script>
<style>body{margin:0;background:#fff}a{color:var(--eg-color-link)}a:hover{color:var(--eg-color-link-hover)}</style>
</helmet>
<div style="position:relative;background:var(--eg-white);color:var(--eg-color-text)">
  <x-import component-from-global-scope="EvenGreenerDesignSystem_ede5a6.AnnouncementBar" hint-size="100%,32px"></x-import>
  <x-import component-from-global-scope="EvenGreenerDesignSystem_ede5a6.Header" nav="{{ nav }}" current="Knowledge hub" utility-links="{{ utility }}" search-scopes="{{ scopes }}" bag-count="{{ bagCount }}" bag-total="{{ bagTotal }}" on-bag="{{ openDrawer }}" hint-size="100%,60px"></x-import>
  <!-- Mobile category bar (28 Oct review). Option B default: one swipeable row of full category names. Option C: compact, sticky, hides on scroll down. ?nav=a|b|c -->
  <sc-if value="{{ catBarB }}" hint-placeholder-val="{{ false }}">
    <nav class="egx-catbar" data-note="N1" aria-label="Shop by category">
      <ul role="list">
        <sc-for list="{{ catBar }}" as="q" hint-placeholder-count="7">
          <li><a href="{{ q.href }}" class="eg-chip">{{ q.label }}</a></li>
        </sc-for>
      </ul>
    </nav>
  </sc-if>
  <sc-if value="{{ catBarC }}" hint-placeholder-val="{{ false }}">
    <nav class="egx-catbar egx-catbar--c" data-note="N1" aria-label="Shop by category">
      <ul role="list">
        <sc-for list="{{ catBar }}" as="q" hint-placeholder-count="7">
          <li><a href="{{ q.href }}" class="eg-chip">{{ q.label }}</a></li>
        </sc-for>
      </ul>
    </nav>
  </sc-if>

  <main>
    <section style="padding-block:{{ L.headPad }}">
      <div style="max-width:var(--eg-container-max);margin-inline:auto;padding-inline:{{ gut }};display:grid;gap:{{ L.headGap }}">
        <x-import component-from-global-scope="EvenGreenerDesignSystem_ede5a6.Breadcrumb" items="{{ crumbs }}" hint-size="200px,20px"></x-import>
        <div style="display:grid;gap:8px;max-width:760px">
          <h1 class="eg-h1" style="margin:0">Knowledge hub</h1>
          <p class="eg-muted" style="margin:0;font-size:{{ L.standfirst }};text-wrap:pretty">Advice, manuals and answers from the EvenGreener team, all in one place.</p>
        </div>
      </div>
    </section>

    <!-- Knowledge hub landing: one card per section in the Knowledge hub menu. Build: page.knowledge-hub.json, a collection-list style
         section of image cards with title, line and link, editable in the theme editor. -->
    <section data-note="K1" aria-label="Knowledge hub sections" style="padding-bottom:{{ secPad }}">
      <div style="max-width:var(--eg-container-max);margin-inline:auto;padding-inline:{{ gut }};display:grid;grid-template-columns:{{ L.cols }};gap:{{ L.cardGap }}">
        <sc-for list="{{ sections }}" as="h" hint-placeholder-count="5">
          <x-import component-from-global-scope="EvenGreenerDesignSystem_ede5a6.CategoryCard" title="{{ h.title }}" text="{{ h.text }}" cta="{{ h.cta }}" href="{{ h.href }}" image="{{ h.image }}" hint-size="100%,420px"></x-import>
        </sc-for>
      </div>
    </section>

    <section aria-labelledby="popular-title" style="background:var(--eg-color-bg-alt);padding-block:{{ secPad }}">
      <div style="max-width:var(--eg-container-max);margin-inline:auto;padding-inline:{{ gut }};display:grid;gap:{{ L.headGap }}">
        <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px">
          <h2 id="popular-title" class="eg-h2" style="margin:0">Popular guides</h2>
          <x-import component-from-global-scope="EvenGreenerDesignSystem_ede5a6.LinkCta" href="Blog Page.dc.html?type=guides" hint-size="110px,24px">View all guides</x-import>
        </div>
        <div style="display:grid;grid-template-columns:{{ L.postCols }};gap:{{ L.cardGap }}">
          <sc-for list="{{ popular }}" as="p" hint-placeholder-count="3">
            <x-import component-from-global-scope="EvenGreenerDesignSystem_ede5a6.PostCard" image="{{ p.image }}" title="{{ p.title }}" excerpt="{{ p.excerpt }}" meta="{{ p.meta }}" href="Article Page.dc.html" hint-size="100%,380px"></x-import>
          </sc-for>
        </div>
      </div>
    </section>
  </main>

  <x-import component-from-global-scope="EvenGreenerDesignSystem_ede5a6.Newsletter" hint-size="100%,320px"></x-import>
  <x-import component-from-global-scope="EvenGreenerDesignSystem_ede5a6.Footer" columns="{{ footerCols }}" hint-size="100%,520px"></x-import>
  <sc-if value="{{ drawerOpen }}" hint-placeholder-val="{{ false }}">
    <dc-import name="Cart Drawer" open="{{ true }}" items="{{ drawerItems }}" on-close="{{ closeDrawer }}" hint-size="0px,0px"></dc-import>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { w: window.innerWidth, ready: !!window.EGData };
  componentDidMount() {
    this.onR = () => this.setState({ w: window.innerWidth });
    window.addEventListener('resize', this.onR);
    this.t = setInterval(() => { if (!this.state.ready && window.EGData) this.setState({ ready: true }); }, 300);
  }
  componentWillUnmount() { clearInterval(this.t); window.removeEventListener('resize', this.onR); }
  renderVals() {
    const D = window.EGData || {}; const S = window.EGUtil ? window.EGUtil.shell(this) : {};
    const m = this.state.w < 900;
    return Object.assign(S, {
      L: { headPad: m ? '20px 24px' : '40px 48px', headGap: m ? '16px' : '24px', standfirst: m ? 'var(--eg-text-body)' : 'var(--eg-text-body-lg)', stripPad: m ? '24px' : '40px',
        cols: m ? 'repeat(2,minmax(0,1fr))' : 'repeat(5,minmax(0,1fr))', postCols: m ? 'minmax(0,1fr)' : 'repeat(3,minmax(0,1fr))', cardGap: m ? '24px 16px' : 'var(--eg-grid-gap)' },
      crumbs: [{ label: 'Home', href: 'Home Page.dc.html' }, { label: 'Knowledge hub' }],
      sections: D.hubSections || [],
      popular: (D.posts || []).filter((p) => p.type === 'guide').slice(0, 3),
    });
  }
}
</script>
</body>
</html>
